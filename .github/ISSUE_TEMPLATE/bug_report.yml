name: Bug report
description: Something in ZenFox doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Created a workspace called "Work"
        2. Opened a new tab
        3. Expected it in Work, but it appeared in Home
    validations:
      required: true
  - type: input
    id: zenfox-version
    attributes:
      label: ZenFox version
      description: about:addons → ZenFox → Version
      placeholder: "0.9.3"
    validations:
      required: true
  - type: input
    id: firefox-version
    attributes:
      label: Firefox version
      description: Firefox menu → Help → About Firefox
      placeholder: "153.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Are you using the "Hide Firefox top tab bar" layout?
      options:
        - "No"
        - "Yes, standard"
        - "Yes, compact (icons, expands on hover)"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please remove private URLs or personal information before posting.
